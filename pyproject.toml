[tool.mypy]
python_version = "3.10"

[tool.poetry]
package-mode = false
name = "rag-against-the-machine"
version = "0.1.0"
description = "Retrieval-Augmented Generation system using TF-IDF/BM25 and Pydantic"
authors = ["Jabir Gaadi"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.10"
pydantic = "^2.0"
scikit-learn = "^1.3.0"
rank-bm25 = "^0.2.2"     # For BM25 retrieval
numpy = "^1.24.0"        # Required for matrix operations
fire = "^0.7.1"
tqdm = "^4.70.1"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
flake8 = "^7.3.0"

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[project]
name = "Rag"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.14.1",
    "transformers>=5.18.0",
]

[dependency-groups]
dev = [
    "flake8>=7.3.0",
    "mypy>=2.3.1",
    "pydantic>=2.13.5",
    "rank-bm25>=0.2.2",
]
