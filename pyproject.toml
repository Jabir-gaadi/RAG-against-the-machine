[project]
name = "rag"
version = "0.1.0"
description = "RAG against the machine"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fire>=0.7.1",
    "pydantic>=2.14.1",
    "rank-bm25>=0.2.2",
    "torch>=2.14.1",
    "tqdm>=4.66.5",
    "transformers>=5.20.1",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.mypy]
python_version = "3.10"
exclude = ["^data/raw/"]

[tool.uv]
package = false